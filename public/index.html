<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador FABCOM</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="/assets/img/logo-fabcom.png" alt="Logo FABCOM" class="logo">
      <h1>Simulador de Crédito FABCOM</h1>
    </header>

    <main class="simulador-card">
      <form id="simuladorForm">
        <div class="form-group">
          <label for="monto">Monto a solicitar ($):</label>
          <input type="number" id="monto" name="monto" placeholder="Ej: 50000" required min="1000">
        </div>

        <div class="form-group">
          <label for="plazo">Plazo (meses):</label>
          <select id="plazo" name="plazo" required>
            <option value="6">6 meses</option>
            <option value="12" selected>12 meses</option>
            <option value="24">24 meses</option>
            <option value="36">36 meses</option>
            <option value="48">48 meses</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Calcular Simulación</button>
      </form>

      <div id="resultado" class="resultado-box" style="display: none;">
        <h3>Resultado de la Simulación</h3>
        <p><strong>Monto:</strong> $<span id="resMonto">0</span></p>
        <p><strong>Plazo:</strong> <span id="resPlazo">0</span> meses</p>
        <p><strong>Cuota Mensual Estimada:</strong> $<span id="resCuota">0</span></p>
        <p><strong>Total a Pagar:</strong> $<span id="resTotal">0</span></p>

        <a id="btnPdf" href="#" target="_blank" class="btn-secondary">Descargar Reporte PDF</a>
      </div>

      <hr>

      <h3>Solicitar información (Lead)</h3>
      <form id="leadForm">
        <div class="form-group">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono">
        </div>
        <div class="form-group">
          <label for="mensaje">Mensaje o comentarios:</label>
          <textarea id="mensaje" name="mensaje" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-success">Enviar Solicitud</button>
      </form>
      <p id="leadResponse" class="msg-response"></p>
    </main>
  </div>

  <script src="/assets/js/app.js"></script>
</body>
</html>
